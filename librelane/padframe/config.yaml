# AUTO-GENERATED by scripts/extract_openframe_pads.py -- do not edit by hand.
# Double-wide openframe padframe, LibreLane 3 Chip flow (sky130-fabulous-testchip style).
meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

    # GPIO 0's pad-facing buses are aliases (bit 0 is the CF_owire_id
    # pin). A genvar ternary is rejected by Verilator 5, and a
    # concatenation select is rejected by Yosys, so the alias is an
    # assign and this checker is off.
    Checker.NetlistAssignStatements: null

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable magic DRC
    Magic.DRC: null
    Checker.MagicDRC: null
    KLayout.DRC: null
    Checker.KLayoutDRC: null
    KLayout.XOR: null
    Checker.XOR: null
    Netgen.LVS: null
    Checker.LVS: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time
    #OpenROAD.IRDropReport: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

    # Disable chip finishing
    # KLayout.Antenna: null
    # Checker.KLayoutAntenna: null
    # KLayout.SealRing: null
    # KLayout.Filler: null
    # KLayout.Density: null
    # Checker.KLayoutDensity: null

    # Because of hierarchy
    Checker.YosysUnmappedCells: null

    # Macro-only padframe: wrapper fills the core, no std-cell rows / PDN rails.
    Odb.AddPDNObstructions: null
    OpenROAD.GeneratePDN: null
    Odb.RemovePDNObstructions: null
    Checker.PowerGridViolations: null
    OpenROAD.GlobalPlacementSkipIO: null
    OpenROAD.GlobalPlacement: null
    Odb.ManualGlobalPlacement: null
    OpenROAD.RepairDesignPostGPL: null
    OpenROAD.DetailedPlacement: null
    OpenROAD.CTS: null
    OpenROAD.ResizerTimingPostCTS: null
    OpenROAD.FillInsertion: null
    OpenROAD.IRDropReport: null
    OpenROAD.CheckAntennas*: null

    # resetb_h / resetb_l are routed by TritonRoute through the south obstruction
    # window (see ROUTING_OBSTRUCTIONS). The simple_por outputs por_l/porb_l/
    # porb_h sit on thin met3 pins ~113um from the wrapper that never get a
    # routing access point (DRT-0419 -> crash), and the xres tie/loopback nets
    # are pad-local, so Padframe.ResetSpecialNets marks them SPECIAL; DRT leaves
    # them alone. The POR outputs reach the wrapper through the simple_por GDS
    # collar; the xres nets are drawn by Padframe.XresLoops.
    -OpenROAD.GlobalRouting: Padframe.ResetSpecialNets
    # porb_h drives ENABLE_H / ENABLE_VDDA_H on every GPIO pad and ENABLE_H on
    # the reset pad, as in the openframe. Like the openframe, that fan-out is
    # hand-drawn rather than routed: a met1 loop around the user area at the
    # openframe offset, with a via1 + met2 stub to each enable pin and a tap on
    # the simple_por porb_h collar. Drawn before global routing so GRT and DRT
    # both see it as fixed metal.
    +Padframe.ResetSpecialNets: Padframe.PorbRing
    # The reset pad's tie-off and loopback nets (xres_vss_loop, xresloop,
    # xres_loopback_one) never leave the pad's core edge and get no router
    # access. The openframe draws them by hand; Padframe.XresLoops places the
    # same wiring relative to the pad.
    +Padframe.PorbRing: Padframe.XresLoops
    # Each clamped3 pad's middle core stub is the other rail of its clamp and
    # goes nowhere on its own. Padframe.ClampLinks joins the vccd<n> and
    # vssd<n> pads of a domain with two met5 straps in the pad-ring gap.
    +Padframe.XresLoops: Padframe.ClampLinks
    # user_id_programming sits in the pad ring with no power grid around it.
    # Padframe.UserIdPower draws the openframe's hookup from its met5 rails to
    # the ring's own vccd / vssd rails, so mask_rev is driven.
    +Padframe.ClampLinks: Padframe.UserIdPower
    +OpenROAD.GlobalRouting: Odb.InsertECODiodes
    # Power nets are SPECIAL (VDD_NETS/GND_NETS) so DRT will not bridge clamp
    # met3 stubs to the wrapper. Draw wide special met3 straps from each clamp
    # domain pin to the facing wrapper edge port before detailed routing -- the
    # power equivalent of the signal pad<->wrapper hop.
    +Odb.InsertECODiodes: Padframe.BridgePowerPads

    # After detailed routing, each gpio_dm0[i] route reaches its own DM[0] pad pin
    # (a short met2 tip stub) but stops 0.07-0.13um short of the pin metal, leaving
    # a *same-net* met2 gap that KLayout flags as m2.2. Bridge each with a small
    # same-net met2 patch (electrically a no-op; only gpio_dm0 metal is present
    # there) so the shapes merge and the gap disappears.
    +OpenROAD.DetailedRouting: Padframe.BridgeDM0
    # The router only touches the tip of each wrapper pin. As in the openframe,
    # the padframe carries its own metal over the whole pin footprint (2.0 um
    # outside the user area, 0.28 / 0.30 um inside), for signals and power.
    +Padframe.BridgeDM0: Padframe.WrapperPinLanding

DESIGN_NAME: double_wide_chip_io
VERILOG_FILES:
- dir::../../verilog/rtl/pad_ef_io_blackboxes.v
- dir::../../verilog/rtl/por_reset_blackboxes.v
- dir::../../verilog/rtl/double_wide_chip_io.v

PAD_VERILOG_MODELS: []

SYNTH_HIERARCHY_MODE: keep

# Macro-only padframe: pads + placed wrapper macro, no std-cell logic to map.
SYNTH_ELABORATE_ONLY: true

RUN_CTS: false
RUN_TAP_ENDCAP_INSERTION: false
RUN_FILL_INSERTION: false
RUN_IRDROP_REPORT: false
RUN_ANTENNA_REPAIR: false
RUN_HEURISTIC_DIODE_INSERTION: false

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

LINTER_DISABLE_WARNINGS:
- DECLFILENAME
- EOFNEWLINE
- PINCONNECTEMPTY
- PINMISSING
- UNUSEDSIGNAL

PAD_CFG: dir::pad_cfg.tcl

# PDK PAD_LEFS is only sky130_ef_io.lef; the openframe reset pad lives in
# sky130_fd_io.lef (sky130_fd_io__top_xres4v2).
EXTRA_LEFS:
- pdk_dir::libs.ref/sky130_fd_io/lef/sky130_fd_io.lef

# PDK PAD_GDS has the pads and the two connect slices but not the disconnect
# slice that cuts the analog rails; without it the cell is streamed out empty.
EXTRA_GDS:
- pdk_dir::libs.ref/sky130_fd_io/gds/sky130_ef_io__disconnect_vdda_slice_5um.gds

# Macro-only padframe (no std-cell rows); keep SCL global-connects off.
PDN_ENABLE_GLOBAL_CONNECTIONS: false

# PDK default omits clamped3 / vdda / vssa HVC clamps — without these their
# bond nets get no DEF PORT / GDS pin label and padframe LVS fails pin matching.
PAD_PLACE_IO_TERMINALS:
- sky130_ef_io__gpiov2_pad/PAD
- sky130_fd_io__top_xres4v2/PAD
- sky130_ef_io__vccd_lvc_clamped_pad/VCCD_PAD
- sky130_ef_io__vccd_lvc_clamped3_pad/VCCD_PAD
- sky130_ef_io__vssd_lvc_clamped_pad/VSSD_PAD
- sky130_ef_io__vssd_lvc_clamped3_pad/VSSD_PAD
- sky130_ef_io__vddio_hvc_clamped_pad/VDDIO_PAD
- sky130_ef_io__vssio_hvc_clamped_pad/VSSIO_PAD
- sky130_ef_io__vdda_hvc_clamped_pad/VDDA_PAD
- sky130_ef_io__vssa_hvc_clamped_pad/VSSA_PAD

